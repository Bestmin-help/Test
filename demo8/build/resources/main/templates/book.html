<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:method="http://www.w3.org/1999/xhtml" xmlns=""
      xmlns:text-align="http://www.w3.org/1999/xhtml" xmlns:align-items="http://www.w3.org/1999/xhtml"
      xmlns:margin-right="http://www.w3.org/1999/xhtml" lang="">
<head>
    <title>Book List</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</head>

<h1 style="text-align: center">Book List</h1>

<body>

<div class="container" style="width: 100vw; height:100%; display:flex; justify-content:center; align-items:center">
    <div>

        <div class="btn-primary" style="margin-bottom: 10px; display: flex; justify-content: left; align-items: center;">
            <a th:href="@{/book/register}"
               style="padding: 10px 20px; text-decoration: none; background-color: #4CAF50; color: white; border-radius: 5px;">
                서재 등록
            </a>
        </div>


        <div class= "search-box" style="margin-bottom: 10px;">
            <!-- onsubmit="return false" 추가하여 폼 제출 동작 막기 -->
            <form id="search-form" onsubmit="return false">
                <div class="sch_group" style="display: flex; align-items: center; ">
                    <select id="searchType" name="searchType" title="검색유형선택" style="margin-right: 15px;">
                        <option value="all">전체검색</option>
                        <option value="bookname">이름</option>
                        <option value="publisher">저자</option>
                    </select>
                    <input type="text" id="keyword" name="keyword" placeholder="검색어를 입력하세요" title="입력"/>
                    <!-- 버튼 타입을 button으로 변경 -->
                    <button type="button" id="search-btn">검색</button>

                        <a th:href="@{/cart}"  style="margin-left: auto;">
                            주문목록
                        </a>

                </div>
            </form>

        </div>


        <table border="1" class="table table-striped table-bordered" style="width: 100%; border-collapse: collapse; margin-bottom: 20px;">
            <thead>
            <tr>
                <th>아이디</th>
                <th>이름</th>
                <th>저자</th>
                <th>가격</th>
                <th>기능</th>
            </tr>
            </thead>
            <tbody>
            <!-- 반복문으로 bookList를 출력 -->
            <tr th:each="book : ${bookList}" th:id="'book-row-' + ${book.bookid}">
                <td th:text="${book.bookid}"></td>  <!-- bookId 출력 -->
                <td th:text="${book.bookname}"></td>  <!-- bookName 출력 -->
                <td th:text="${book.publisher}"></td>  <!-- publisher 출력 -->
                <td th:text="${book.price}"></td>  <!-- price 출력 -->
                <td>
                    <a th:href="@{/book/modify/{bookid}(bookid=${book.bookid})}">수정</a>
                    <form th:action="@{/book/delete/{bookid}(bookid=${book.bookid})}" method="post" style="display:inline;">
                        <button type="submit"
                                style="background:none; border:none; padding:0; margin:0; font: inherit; color:blue; text-decoration:underline; cursor:pointer;"
                                onclick="return confirm('정말 삭제하시겠습니까?');">삭제</button>
                    </form>

                        <button type="button" class="add-btn" th:data-bookid="${book.bookid}" style="background:none; border:none; padding:0; margin:0; font: inherit; color:blue; text-decoration:underline; cursor:pointer;">
                            담기
                        </button>

                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

<script>

    function bindDeleteEvents() {
        // 삭제 버튼 클릭 이벤트
        $('.delete-btn').click(function(e) {
            e.preventDefault();
            if(confirm('정말 삭제하시겠습니까?')) {
                var bookid = $(this).data('bookid');

                // AJAX 호출
                $.ajax({
                    url: '/book/delete/' + bookid,
                    type: 'DELETE',
                    success: function(result) {
                        // 성공 시 해당 행 제거
                        $('#book-row-' + bookid).remove();
                        alert('책이 삭제되었습니다.');
                    },
                    error: function(xhr, status, error) {
                        alert('삭제 중 오류가 발생했습니다: ' + error);
                    }
                });
            }
        });
    }
</script>

<script>

    function addEvents() {
        // 주문 버튼 클릭 이벤트
        $('.add-btn').click(function(e) {
            e.preventDefault();
            if(confirm('주문하시겠습니까?')) {
                var bookid = $(this).data('bookid');

                // AJAX 호출 -> 담은걸 데이터로 보내야하니까 get이 아닌 post로 사용한다
                $.ajax({
                    url: '/book/add/' + bookid,
                    type: 'post',
                    success: function(result) {
                        // 성공 시 해당 행 장바구니에 담기
                        $('#book-row-' + bookid).add();
                        alert('주문 목록에 추가되었습니다.');
                    },
                    error: function(xhr, status, error) {
                        alert('처리 중 오류가 발생했습니다: ' + error);
                    }
                });
            }
        });
    }
</script>

<script>
    function movePage(page) {
        // 검색 조건 가져오기
        const searchType = document.getElementById('searchType').value;
        const keyword = document.getElementById('keyword').value;

        // AJAX 호출
        $.ajax({
            url: '/book/search',
            type: 'GET',
            data: {
                page: page,
                searchType: searchType,
                keyword: keyword
            },
            success: function (response) {
                // 검색 결과 영역 찾기
                const tbody = $('table tbody');

                // 결과 영역 비우기
                tbody.empty();

                if (response.length > 0) {
                    $.each(response, function (i, book) {
                        const row = `
                <tr id="book-row-${book.bookid}">
                <td>${book.bookid}</td>
                <td>${book.bookname}</td>
                <td>${book.publisher}</td>
                <td>${book.price}</td>
                <td>
                    <a href="/book/modify/${book.bookid}">수정</a>
                    <a href="javascript:void(0);" class="delete-btn" data-bookid="${book.bookid}">삭제</a>
                </td>
                    </tr>
                `;
                        tbody.append(row);

                    });


                    bindDeleteEvents();
                    addEvents();
                } else {
                    const row = '<tr>' +
                        '<td colspan="6" style="text-align: center;">검색 결과가 없습니다</td>' +
                        '</tr>';
                    tbody.append(row);
                }

            }, error: function (xhr, status, error) {
                console.error('검색오류: ' , error);
                alert('검색 중 오류가 발생했습니다');
            }

        });
    }
        $('#search-btn').click(function(e) {
            e.preventDefault();
            movePage(1);
        });

    $(document).ready(function() {
        bindDeleteEvents();
        addEvents();

        // 검색 버튼 클릭 이벤트 추가

        $('#keyword').keypress(function(e) {
            if (e.keyCode === 13) {
                e.preventDefault();
                movePage(1);
            }
        });
    });

</script>
</body>
</html>
