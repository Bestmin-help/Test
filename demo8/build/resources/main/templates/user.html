<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>사용자 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body th:align="center">
<div class="container mt-5">
        <h1 class = "text-center mb-4"> 사용자 목록</h1>

        <form id="userForm" class="mb-4">
            <div class="row g-3">
                <div class="col-auto">
                     <input type="text" class="form-control" id="username" placeholder="이름" required>
                </div>
                <div class="col-auto">
                    <input type="text" class="form-control" id="password" placeholder="비밀번호" required>
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary mb-3">등록</button>
                </div>
            </div>
        </form>

        <table class="table table-bordered">
            <thead>
            <tr>
                <th>아이디</th>
                <th>이름</th>
                <th>비밀번호</th>
                <th>삭제</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${userList}">
                <td th:text="${user.id}"></td>
                <td th:text="${user.username}"></td>
                <td th:text="${user.email}"></td>
                <td><button class="btn btn-danger btn-delete" th:data-id="${user.id}">삭제</button></td>
            </tr>
            </tbody>
        </table>
    </div>
    <script>
        // 사용자 등록 Ajax
        $('#userForm').submit(function (e) {
            e.preventDefault();
            $.post('/user/register', {
                username: $('#username').val(),
                password: $('#password').val()
            }).done(function () {
                alert('사용자 등록 성공!');
                location.reload();
            });
        });

        // 사용자 삭제 Ajax
        $('.btn-delete').click(function () {
            const userId = $(this).data('id');
            $.ajax({
                url: '/user/delete/' + userId,
                type: 'GET',
                success: function () {
                    alert('삭제 완료!');
                    location.reload();
                }
            });
        });
    </script>


</body>
</html>
