<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <title>장바구니</title>
</head>

<h1 style="text-align: center">장바구니</h1>

<body>
    <div class="container" style="width:100vw; height:100vh; display: flex; justify-content:center; align-items:center;">

        <div th:if="${#lists.isEmpty(cartItems)}" class="alert alert-info" >장바구니가 비어있습니다.</div>

        <div th:unless="${#lists.isEmpty(cartItems)}"><table border="1" class="table table-striped table-bordered" style="width: 100%; border-collapse: collapse; margin-bottom: 20px;">
            <thead>
            <tr>
                <th>아이디</th>
                <th>이름</th>
                <th>저자</th>
                <th>가격</th>
                <th>기능</th>
            </tr>
            </thead>
            <tbody>
            <!-- 반복문으로 bookList를 출력 -->
            <tr th:each="item : ${cartItems}" >
                <td th:text="${item.book.bookid}"></td>  <!-- bookId 출력 -->
                <td th:text="${item.book.bookname}"></td>  <!-- bookName 출력 -->
                <td th:text="${item.book.publisher}"></td>  <!-- publisher 출력 -->
                <td th:text="${item.book.price}"></td>  <!-- price 출력 -->
                <td>
                    <button class="btn-remove" th:data-id="${item.id}">삭제</button>

                </td>
            </tr>
            </tbody>
            <tfoot>
            <tr>
                <td colspan="5" class="Allprice">총액:<span th:text="${totalAmount}"></span></td>

            </tr>
            </tfoot>
        </table>
        </div>

        <div class="d-flex justify-content-between mt-3">
            <a href="/book" class="btn-backbook">계속 쇼핑하기</a>
            <a href="/order" class="btn btn-but" onclick="return confirm('주문하겠습니까?');">주문하기</a>
            <button id="clear-cart" class="btn-clear">장바구니 비우기</button>
        </div>


    </div>
    <script>
        // 개별 삭제
        $(document).on("click", ".btn-remove", function () {
            const cartItemId = $(this).data("id");
            if (confirm("이 항목을 삭제할까요?")) {
                $.ajax({
                    url: `/cart/remove/${cartItemId}`,
                    type: 'DELETE',
                    success: function (res) {
                        alert(res.message);
                        location.reload();
                    },
                    error: function () {
                        alert("삭제 중 오류 발생");
                    }
                });
            }
        });
            // 전체 삭제
            $("#clear-cart").click(function () {
            if (confirm("장바구니를 모두 비울까요?")) {
            $.ajax({
            url: "/cart/clear",
            type: "DELETE",
            success: function (res) {
            alert(res.message);
            location.reload();
        },
            error: function () {
            alert("비우기 중 오류 발생");
        }
        });
        }
        });
    </script>



</body>
</html>
